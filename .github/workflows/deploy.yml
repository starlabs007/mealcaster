name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job asks for what it needs; only deploy can publish to Pages.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Google credentials live in the `production` environment (as variables or secrets).
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # Vite, Rollup and Svelte print warnings on stderr and a clean build prints nothing there, so any stderr output
      # fails the deploy (#210).
      - name: Build (fails on warnings)
        run: |
          npm run build 2> "$RUNNER_TEMP/build-stderr.txt" || { cat "$RUNNER_TEMP/build-stderr.txt" >&2; exit 1; }
          if [ -s "$RUNNER_TEMP/build-stderr.txt" ]; then
            cat "$RUNNER_TEMP/build-stderr.txt" >&2
            echo "::error title=Build warnings::npm run build printed warnings (above). Fix them before deploying."
            exit 1
          fi
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY || secrets.GOOGLE_API_KEY }}
          GOOGLE_APP_ID: ${{ vars.GOOGLE_APP_ID || secrets.GOOGLE_APP_ID }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
