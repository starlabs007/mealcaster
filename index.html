<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MealCaster — weekly dinner planning for the home cook." />
    <title>MealCaster · Weekly Menu</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <!-- Home Screen shortcut: iOS uses apple-touch-icon (not the favicon); the manifest covers Android and standalone mode. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="MealCaster" />
    <meta name="theme-color" content="#f4f4ef" />
    <script>
      // The theme before the first paint, so a dark device never flashes light: the saved choice (Profile › This Device ›
      // Appearance, see src/lib/theme.js), or the system setting. src/lib/devicePrefs.svelte.js keeps it in step afterwards.
      try {
        var choice = localStorage.getItem('mealcaster.theme.v1');
        var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#11141c');
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background font-sans text-on-surface antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
